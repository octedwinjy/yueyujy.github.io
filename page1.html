<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>受保护页面</title>
  <script>
    // 密码保护功能
    function checkPassword() {
      var password = prompt("请输入密码以访问此页面:");
      if (password == "123456") { // 设置密码
        alert("密码正确，访问页面。");
      } else {
        alert("密码错误！访问被拒绝。");
        window.location.href = "index.html"; // 密码错误时重定向回首页
      }
    }

    // 页面加载时执行检查
    window.onload = checkPassword;
  </script>
</head>
<body>
  <h1>这是受保护的页面（Page1）</h1>
  <p>欢迎来到受保护的页面内容！</p>
</body>
</html>
